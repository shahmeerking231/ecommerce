services:
  app:
    build: .
    env_file:
      - .env
    ports:
      - "3000:${PORT}"
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started

  redis:
    image: redis:alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
